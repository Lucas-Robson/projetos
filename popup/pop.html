<!DOCTYPE html>
<html lang="en-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-ups</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: linear-gradient(135deg, #141e30, #243b55);
            flex-wrap: wrap;
        }

        .popup{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        .conteudo{
            background-color: white;
            width: 320px;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin: 150px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: aparecer 0.3s ease;
        }

        .conteudo h2{
            margin-bottom: 15px;
            color: #222;
        }

        .conteudo p{
            color: #666;
            margin-bottom: 20px;
        }

        button{
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            transform: scale(1.05);
            background: #4338ca;
        }

        @keyframes aparecer{
            from{
                opacity: 0;
                transform: translateY(-20px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>

    <!-- POPUP 1 -->
    <div id="popup1" class="popup">
        <div class="conteudo">
            <h2>senha</h2>
            <input type="password" placeholder="Digite seu nome de usuário">
            <input type="password" placeholder="Digite sua senha">
            <button onclick="fechar('popup1')">Entrar</button>
        </div>
    </div>

    <!-- POPUP 2 -->
    <div id="popup2" class="popup">
        <div class="conteudo">
            <h2>Deseja realmente excluir este item?</h2>
            <button onclick="fechar('popup2')">Sim</button>
            <button onclick="fechar('popup2')">Não</button>
        </div>
    </div>
<!-- IMAGEM BOTÃO -->
<img 
    src="https://picsum.photos/300" 
    width="200"
    onclick="abrir('popup3')"
    style="cursor: pointer; border-radius: 10px;"
>


<!-- POPUP 3 -->
<div id="popup3" class="popup">
    <div class="conteudo">

        <h2>Imagem ampliada</h2>

        <img src="https://picsum.photos/300" width="100%">

        <br><br>

        <button onclick="fechar('popup3')">Fechar</button>

    </div>
</div>

<!-- POPUP 4 -->
<div id="popup4" class="popup">
    <div class="conteudo">
        <h2>Curiosidade</h2>

        <p>O polvo possui 3 corações.</p>

        <button onclick="fechar('popup4')">Fechar</button>
    </div>
</div>

<!-- POPUP 5 -->
<div id="popup5" class="popup">
    <div class="conteudo">
        <h2>Aviso</h2>

        <p>Parabéns! Você acertou a senha.</p>

        <button onclick="fechar('popup5')">Fechar</button>
    </div>
</div>


    <button onclick="abrir('popup1')">Abrir 1</button>
    <button onclick="abrir('popup2')">Abrir 2</button>
    <button onclick="abrir('popup3')">Abrir 3</button>
    <button onclick="abrir('popup4')">Abrir 4</button>
    <button onclick="abrir('popup5')">Abrir 5</button>


    <script>

        function abrir(id){
            document.getElementById(id).style.display = "block"
        }

        function fechar(id){
            document.getElementById(id).style.display = "none"
        }

    </script>

</body>
</html>
