<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha</title>

<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #1e1e2f, #2b2b45);
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1{
        color: white;
        margin-bottom: 30px;
        font-size: 40px;
    }

    input{
        width: 320px;
        padding: 14px;
        border: none;
        outline: none;
        border-radius: 12px;
        margin: 10px 0;
        font-size: 16px;
        background-color: #f5f5f5;
        transition: 0.3s;
    }

    input:focus{
        transform: scale(1.03);
        box-shadow: 0 0 10px #6c63ff;
    }

    #mensagem{
        margin-top: 20px;
        width: 320px;
        text-align: center;
        font-size: 15px;
        font-weight: bold;
        line-height: 22px;
    }

    .certo{
        color: #00ff88;
    }

    .errado{
        color: #ff4d4d;
    }

</style>
</head>

<body>

    <h1>Validador de Senhas</h1>

    <input type="text" id="senha" placeholder="Digite a senha">

    <br><br>

    <input type="text" id="confirmar" placeholder="Confirme sua senha">

    <p id="mensagem"></p>

    <script>
let senha = document.getElementById("senha")
let confirmar = document.getElementById("confirmar")
let mensagem = document.getElementById("mensagem")


confirmar.addEventListener("input", function(){

    let numero = /[0-9]/.test(senha.value)
    let minusculas = /[a-z]/.test(senha.value)
    let maiusculas = /[A-Z]/.test(senha.value)
    let especial = /[!@#$%&;.]/.test(senha.value)
    let tamanho = senha.value.length >= 12


    if(senha.value == confirmar.value && numero && minusculas && especial && tamanho){
        mensagem.innerText="As senhas estão iguais"
        mensagem.classList.add("certo")
        mensagem.classList.remove("errado")
    } else {
        mensagem.innerText="A senha precisa ter números, letras maiúsculas, letras minúsculas, caractéres especiais, 8 caractéres e ser igual"
        mensagem.classList.remove("certo")
        mensagem.classList.add("errado")
    }
})

function mostrarSenha(){
    if(senha.type == "password"){
        senha.type = "text"
    } else {
        senha.type = "password"
    }
}

    </script>

</body>
</html>
