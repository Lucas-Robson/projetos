    <style>

        body{
            background-color: #141e30;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .carrossel{
            width: 350px;
            position: relative;
            overflow: hidden;
            margin: 30px auto;
            background: white;
            padding: 15px;
            border-radius: 15px;
        }

        img{
            width: 100%;
            display: none;
            border-radius: 10px;
        }

        .ativa{
            display: block;
        }

        button{
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            margin: 10px;
        }

        h2{
            color: black;
        }

        p{
            color: green;
            font-size: 22px;
        }

    </style>

    <script>

        // PRODUTO
        let imagens = document.querySelectorAll('.produto')

        let indice = 0

        function mostrarImagens(){

            imagens.forEach(function(img){
                img.classList.remove('ativa')
            })

            imagens[indice].classList.add('ativa')
        }

        function proximo(){

            indice++

            if(indice >= imagens.length){
                indice = 0
            }

            mostrarImagens()
        }

        function voltar(){

            indice--

            if(indice < 0){
                indice = imagens.length - 1
            }

            mostrarImagens()
        }



        // FILMES
        let filmes = document.querySelectorAll('.filme')

        let indiceFilme = 0

        function mostrarFilmes(){

            filmes.forEach(function(img){
                img.classList.remove('ativa')
            })

            filmes[indiceFilme].classList.add('ativa')
        }

        function avancarAutomatico(){

            indiceFilme++

            if(indiceFilme >= filmes.length){
                indiceFilme = 0
            }

            mostrarFilmes()
        }

        setInterval(avancarAutomatico, 3000)

    </script>
